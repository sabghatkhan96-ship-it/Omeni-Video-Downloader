<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Suppress Vite HMR WebSocket closing errors in iframe/preview environments
      window.addEventListener('unhandledrejection', function(e) {
        var str = String(e && (e.reason && (e.reason.message || e.reason.stack || e.reason) || e));
        if (str.indexOf('WebSocket') !== -1 || str.indexOf('vite') !== -1) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(e) {
        var str = String(e && (e.message || e.error || e));
        if (str.indexOf('WebSocket') !== -1 || str.indexOf('vite') !== -1) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
    </script>
    <title>OmniStream - Ultimate Social Media Video Downloader</title>
